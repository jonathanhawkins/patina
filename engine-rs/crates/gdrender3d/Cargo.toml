[package]
name = "gdrender3d"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
gpu = ["wgpu", "pollster", "bytemuck"]
# Browser render path (pat-u3l8c.110): compiles wgpu's WebGL2 backend in
# addition to the default WebGPU one, so `wgpu_surface` can fall back when a
# browser has no WebGPU. `webgl` is a wgpu *Cargo* feature, so the fallback has
# to be selected at build time rather than at runtime. Inert on native targets
# (wgpu's `webgl` cfg alias requires `not(native)`), and off by default, so
# desktop builds are unaffected.
webgl = ["gpu", "wgpu/webgl"]

[dependencies]
gdcore = { path = "../gdcore" }
gdresource = { path = "../gdresource" }
gdserver3d = { path = "../gdserver3d" }
gdvariant = { path = "../gdvariant" }
thiserror.workspace = true
tracing.workspace = true
wgpu = { version = "29", optional = true }
pollster = { version = "0.4", optional = true }
bytemuck = { version = "1", features = ["derive"], optional = true }
