[package]
name = "gdaudio"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
gdcore = { path = "../gdcore" }
hound = "3"
lewton = "0.10"
# Ogg transport demuxing for OggPacketSequence (pat-nzgdu.188); already in the
# lock as a lewton dependency, so this pins no new version.
ogg = "0.8"
# Real ISO MP3 decoding (pat-p0s82.13); Godot uses the same minimp3 decoder.
minimp3 = "0.6"
thiserror.workspace = true
tracing.workspace = true

# cpal drives the native audio device and does not build for wasm32, which is
# why `patina-web` had to exclude gdaudio entirely (pat-0q2kx.59). Everything
# else in this crate — mixer, server, decoders, effects — is portable Rust, so
# gating the device layer here lets the whole audio stack compile to wasm and
# feed an AudioWorklet instead.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cpal = "0.15"

[dev-dependencies]
tempfile = "3"
