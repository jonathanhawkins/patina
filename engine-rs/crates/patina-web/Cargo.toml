[package]
name = "patina-web"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
# cdylib: the wasm module the browser instantiates. rlib: lets the crate be
# unit-tested on the host and linked by native tooling.
crate-type = ["cdylib", "rlib"]

[dependencies]
# Wasm-safe engine core linked into the web runtime.
#
# The note that used to sit here said gdscene was held back because
# `gdscene -> gdaudio -> cpal` and `gdrender3d -> native wgpu` needed cfg-gating,
# staged as pat-u3l8c.110-.113. Both have since landed and it is now stale
# (verified pat-s3rrv.40): gdaudio declares cpal under
# `[target.'cfg(not(target_arch = "wasm32"))'.dependencies]`, and gdrender3d's
# wgpu/pollster/bytemuck sit behind its optional `gpu` feature, which gdscene
# does not enable. So gdscene brings no native-only crate onto wasm32.
gdcore = { path = "../gdcore" }
gdvariant = { path = "../gdvariant" }
# The engine's real mixer (AudioServer + AudioMixer) plus the web device layer
# it feeds (gdaudio::WebAudioOutput). Not target-gated: gdaudio's native-only
# pieces (cpal, minimp3) are gated inside that crate, and keeping it on both
# targets is what lets the mixer -> ring -> worklet-block path in `audio` be
# unit-tested on the host instead of only in a browser (pat-u3l8c.112).
gdaudio = { path = "../gdaudio" }

# pat-s3rrv.40: MainLoop + FrameDriver live here, and the web entry needs both to
# drive frames from requestAnimationFrame. Not a cycle — nothing in the
# workspace depends on patina-web; it is the wasm leaf.
gdscene = { path = "../gdscene" }

# pat-u3l8c.113: PckMount - the `.pck` reader the web VFS mounts over `res://`.
# Not a new crate on wasm32: `gdscene` above depends on gdresource
# unconditionally, so it is already in this crate's wasm tree and proven to
# build for the target. Named directly because `vfs` constructs `PckMount`.
gdresource = { path = "../gdresource" }

# pat-s3rrv.41: InputEvent / Key / MouseButton / GamepadAxis live here. Wasm-safe
# — winit and softbuffer are optional and off by default, and the crate already
# carries a `cfg(target_arch = "wasm32")` dependency section.
gdplatform = { path = "../gdplatform" }

# Browser bindings are only needed when actually targeting wasm32; keeping them
# target-gated keeps native `cargo test -p patina-web` dependency-light.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
# Required by `#[wasm_bindgen]` on an `async fn`: the macro expands to a
# `wasm_bindgen_futures::future_to_promise` call, so the crate must be a direct
# dependency even though no code here names it. `canvas.rs`'s
# `start_canvas_renderer` (pat-u3l8c.110) is async and shipped without it, which
# broke `cargo check -p patina-web --target wasm32-unknown-unknown` with E0433
# ("unresolved module or unlinked crate `wasm_bindgen_futures`") — the native
# build never sees it, so nothing caught it until a wasm check was actually run
# (pat-u3l8c.112).
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
# Canvas rendering (pat-u3l8c.110). `webgl` adds wgpu's WebGL2 backend next to
# the default WebGPU one so browsers without WebGPU still get an adapter; wgpu
# itself is reached through `gdrender3d::wgpu` so the versions cannot skew.
gdrender3d = { path = "../gdrender3d", features = ["webgl"] }
# `AudioContext`/`BaseAudioContext` are what the audio backend (pat-u3l8c.112)
# needs: constructing the graph and reading the rate the browser actually chose,
# which is the rate the mixer output has to be resampled to.
web-sys = { version = "0.3", features = [
    "AudioContext",
    "BaseAudioContext",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "Window",
    # pat-u3l8c.111: the frame loop and the DOM input listeners.
    # `Performance` is `performance.now()`, the clock the touch tracker
    # differences a drag against; the frame loop gets its timestamp from
    # requestAnimationFrame instead.
    "Performance",
    # Every event type a listener is annotated with has to be enabled, even the
    # ones reachable only through a Deref chain the compiler already knows:
    # `Element` pulls in `EventTarget`/`Node`, but not `MouseEvent`.
    "Event",
    "KeyboardEvent",
    "MouseEvent",
    "PointerEvent",
    "WheelEvent",
    "TouchEvent",
    "TouchList",
    "Touch",
    # `getBoundingClientRect()`, for the canvas origin a pointer position is
    # measured from. `DomRect` enables its `DomRectReadOnly` base, which is
    # where `left()`/`top()` actually live.
    "DomRect",
    "Navigator",
    "Gamepad",
    "GamepadButton",
    "GamepadMappingType",
] }
