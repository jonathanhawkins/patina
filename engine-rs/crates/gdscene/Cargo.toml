[package]
name = "gdscene"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# FxHash for the per-node property map, the hottest map in the engine: every
# property read (hundreds per node per frame across transform, render and
# script paths) hashed a String through std's SipHash, ~10% of the editor's
# busy time playing the 2D Platformer demo. Already in Cargo.lock (2.1.3).
rustc-hash = "2"
gdcore = { path = "../gdcore" }
gdvariant = { path = "../gdvariant" }
gdserver2d = { path = "../gdserver2d" }
gdobject = { path = "../gdobject" }
gdresource = { path = "../gdresource" }
gdscript-interop = { path = "../gdscript-interop" }
gdphysics2d = { path = "../gdphysics2d" }
gdphysics3d = { path = "../gdphysics3d" }
gdaudio = { path = "../gdaudio" }
gdserver3d = { path = "../gdserver3d" }
gdrender3d = { path = "../gdrender3d" }
gdrender2d = { path = "../gdrender2d" }
gdplatform = { path = "../gdplatform" }
# Already used by gdresource and gdrender2d at this exact version and already
# resolved in Cargo.lock (0.8.9) — HTTPRequest.accept_gzip needs a decoder and
# this adds no new package to the graph.
miniz_oxide = "0.8"
thiserror.workspace = true
tracing.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile = "3"
# Encodes a WebP fixture for the fresh-clone texture test (same crate/features as gdresource).
image = { version = "0.25", default-features = false, features = ["webp", "png"] }
# Lets tests assert on emitted diagnostics — pat-0q2kx.6 requires that a scene
# naming a missing audio stream WARNS rather than failing silently, which is
# only observable through the tracing output.
tracing-subscriber = { workspace = true }

