[package]
name = "gdresource"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
gdcore = { path = "../gdcore" }
gdvariant = { path = "../gdvariant" }
gdobject = { path = "../gdobject" }
thiserror.workspace = true
tracing.workspace = true
serde_json.workspace = true
miniz_oxide = "0.8"
# Pure-Rust zstd decoder for Godot's RSCC-compressed binary resources
# (`FileAccessCompressed`, mode Zstd is the resource saver's default). The
# encoder half is used only by tests to build fixtures.
ruzstd = "0.8"
ttf-parser = "0.25"
# Pure-Rust WebP decoding (pat-nzgdu.8). Godot stores default 2D textures as
# WebP-in-.ctex and decodes source .webp via libwebp; the `image` crate's webp
# feature (backed by image-webp) gives the same decode with no C dependency.
# `jpeg` (zune-jpeg, pure Rust) decodes source .jpg/.jpeg textures (pat-null9):
# truck_town's tree trunk is a JPEG and drew untextured without it.
image = { version = "0.25", default-features = false, features = ["webp", "png", "jpeg"] }
# Pure-Rust, wasm-friendly SVG rasterization (pat-nzgdu.44). resvg re-exports
# usvg + tiny_skia; tiny-skia 0.11.4 is already in the workspace lock, so this
# reuses it rather than duplicating. Godot renders vector assets/icons this way.
resvg = "0.44"

[dev-dependencies]
tempfile = "3"
proptest = "1"
