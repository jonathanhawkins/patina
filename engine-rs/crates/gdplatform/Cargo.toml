[package]
name = "gdplatform"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
windowed = ["winit", "softbuffer"]

[dependencies]
gdcore = { path = "../gdcore" }
gdvariant = { path = "../gdvariant" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror.workspace = true
# Monotonic clock that works on both native and wasm32 (performance.now on the
# web); std::time::Instant panics on wasm32-unknown-unknown. See os.rs (pat-u3l8c.109).
web-time = "1.1"
winit = { version = "0.30", optional = true }
softbuffer = { version = "0.4", optional = true }

# Browser bindings for the real JavaScriptBridge (js_bridge.rs, pat-u3l8c.115).
# Target-gated so native builds stay dependency-light, and deliberately js-sys
# only: everything the bridge touches (eval, Reflect, Blob, URL, document) is
# reachable reflectively, so gdplatform does not have to track `web-sys`'s
# per-DOM-type feature list or its BlobPropertyBag API churn.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
