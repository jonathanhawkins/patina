[package]
name = "gdcore"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
regex = "1"
serde_json = "1"
aes = "0.8"
# CSPRNG for `crypto::generate_random_bytes` (pat-s3rrv.195). Already compiled
# in this workspace as a transitive dependency of ahash, rand_core and tempfile,
# and 0.3.4 is already pinned in Cargo.lock, so this adds no new build.
getrandom = "0.3"
cbc = { version = "0.1", features = ["alloc"] }
thiserror.workspace = true
tracing.workspace = true

# getrandom 0.3 refuses to compile for wasm32-unknown-unknown unless its
# `wasm_js` backend (crypto.getRandomValues) is both enabled here AND selected
# with `--cfg getrandom_backend="wasm_js"`, which engine-rs/.cargo/config.toml
# sets for that target. Without both, `scripts/web.sh` / check-wasm.sh fail.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }

[dev-dependencies]
proptest = "1"
tempfile = "3"
