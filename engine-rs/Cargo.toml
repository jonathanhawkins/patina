[workspace]
resolver = "2"
members = [
    "crates/gdcore",
    "crates/gdvariant",
    "crates/gdobject",
    "crates/gdresource",
    "crates/gdscene",
    "crates/gdserver2d",
    "crates/gdrender2d",
    "crates/gdphysics2d",
    "crates/gdaudio",
    "crates/gdplatform",
    "crates/gdscript-interop",
    "crates/gdphysics3d",
    "crates/gdserver3d",
    "crates/gdrender3d",
    "crates/gdeditor",
    "crates/patina-runner",
    "crates/patina-web",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/jonathanhawkins/patina"

[workspace.dependencies]
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Root package for examples and integration tests.
[package]
name = "patina-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
gdcore = { path = "crates/gdcore" }
gdvariant = { path = "crates/gdvariant" }
gdscene = { path = "crates/gdscene" }
gdserver2d = { path = "crates/gdserver2d" }
gdrender2d = { path = "crates/gdrender2d" }
gdphysics2d = { path = "crates/gdphysics2d" }
gdplatform = { path = "crates/gdplatform" }
gdaudio = { path = "crates/gdaudio" }
gdobject = { path = "crates/gdobject" }
gdresource = { path = "crates/gdresource" }
gdscript-interop = { path = "crates/gdscript-interop" }
gdphysics3d = { path = "crates/gdphysics3d" }
gdserver3d = { path = "crates/gdserver3d" }
gdrender3d = { path = "crates/gdrender3d" }
gdeditor = { path = "crates/gdeditor" }
patina-runner = { path = "crates/patina-runner" }
serde_json.workspace = true

[features]
# Enables the wgpu GPU path in gdrender3d so the workspace-level GPU integration
# tests (tests/render_3d_gpu_pipeline_test.rs, `#[cfg(feature = "gpu")]`) compile
# and run — they skip themselves when no adapter is present. Non-default so plain
# builds are unaffected (the editor already links wgpu via gdeditor's default
# `gpu-render` feature). Run the GPU tests with `--features gpu`.
gpu = ["gdrender3d/gpu"]

[[example]]
name = "demo_2d"
path = "examples/demo_2d.rs"

[[example]]
name = "benchmarks"
path = "examples/benchmarks.rs"

[[example]]
name = "platformer_demo"
path = "examples/platformer_demo.rs"

[[example]]
name = "hello_gdscript"
path = "examples/hello_gdscript.rs"

[[example]]
name = "space_shooter"
path = "examples/space_shooter.rs"

[[example]]
name = "space_shooter_live"
path = "examples/space_shooter_live.rs"

[dev-dependencies]
tempfile = "3"
serde_json.workspace = true
proptest = "1"
# pat-yuyqw: editor OpenAPI 3 spec validation
openapiv3 = "2"
serde_yaml = "0.9"

[[example]]
name = "editor"
path = "examples/editor.rs"

# Verifier-lane build speed: ~550 integration test binaries each link the full
# engine, and full DWARF (debuginfo=2) dominates that link time. Line tables
# keep file:line in panic backtraces — enough for swarm verify triage — while
# cutting compile+link cost substantially. Set `debug = 2` locally if you need
# full variable info under a debugger.
[profile.dev]
debug = "line-tables-only"

# RSA keygen cost (pat-s3rrv.195). `Crypto.generate_rsa(2048)` is a prime
# search in `num-bigint-dig`, and an unoptimised bigint makes that tens of
# times slower — slow enough that the script-level acceptance test looks hung
# rather than slow. Optimising ONLY the bigint and RSA crates keeps every
# first-party crate at `opt-level = 0`, so panic line numbers and step
# debugging in engine code are unchanged; `profile.test` inherits `profile.dev`,
# so this covers the test binaries too.
[profile.dev.package.num-bigint-dig]
opt-level = 3

[profile.dev.package.rsa]
opt-level = 3
