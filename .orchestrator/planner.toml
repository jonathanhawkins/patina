# Patina Engine planner configuration.
#
# Drives `patina-orchestrator plan`. Phases run in declaration order. The
# first phase whose `completion` is not yet satisfied becomes the active
# phase — the planner ticks its criteria from passing tests, then seeds
# beads from its execution map.
#
# When `analysis.source = "criteria"`, the planner extracts test names from
# the criteria file (lines ending in `(test: \`name\`)`) and runs them via
# `cargo nextest --test <bin> ...` — scoped to the `test_binaries` listed on
# the phase. Passing tests auto-tick their `- [ ]` boxes to `- [x]`. When all
# boxes are checked the phase advances.
#
# IMPORTANT: `test_binaries` MUST list the cargo test-target names so the
# build is scoped to those targets only. With `test_binaries` empty, the
# planner SKIPS the analysis subprocess entirely — it will never run a
# `--workspace` build (that compiles 400+ integration tests and locks the
# machine).

# ─── Phase 1: editor-agent (security + API + quality) ─────────────────────
# Fully implemented — the swarm closed all 20 beads for this map. `test_binaries`
# is intentionally empty: re-running the editor test suite every cycle is pure
# overhead, and 2 of the 20 criteria tests (bottom_panel/viewport_golden) were
# never written, so the phase can never reach all-criteria-checked. With no
# analysis, the planner sees the fully-deduped execution map (every item already
# has a closed bead), produces zero new beads, and falls through to phase 2.
# The boxes staying unchecked is cosmetic; the work is done.
[[phase]]
label = "editor-agent"
execution_map = "prd/EDITOR_AGENT_EXECUTION_MAP.md"
exit_criteria = "prd/EDITOR_AGENT_EXIT.md"
analysis = { source = "criteria" }
test_binaries = []
completion = ["all_criteria_checked"]

# ─── Phase 2: editor-parity bootstrap ─────────────────────────────────────
# Meta-phase: each bead asks the swarm to author a per-lane execution map
# for the editor parity backlog (Scene Tree, Inspector, Viewport, etc.).
# When complete, the next phase's execution map exists and the planner
# automatically advances to seed lane-level work.
#
# All 19 bootstrap tests live in one integration test target, so analysis
# compiles only that binary (NOT the whole 400+ test workspace).
[[phase]]
label = "editor-parity-bootstrap"
execution_map = "prd/EDITOR_PARITY_BOOTSTRAP_MAP.md"
exit_criteria = "prd/EDITOR_PARITY_BOOTSTRAP_EXIT.md"
analysis = { source = "criteria" }
test_binaries = ["editor_parity_bootstrap_map_test"]
completion = ["all_criteria_checked"]

# ─── Phase 3: editor-parity (aggregate of per-lane maps) ──────────────────
# The 154 acceptance tests in EDITOR_PARITY_EXIT.md are scoped for analysis as:
#   - 149 LIB unit tests (144 in gdeditor/src, 5 in gdscene/src) → `test_packages`
#     + `lib = true` builds just those two lib test targets.
#   - 5 integration-only targets → `test_binaries`.
# Together they cover all 154 without a --workspace build, and the run
# re-launches only ~7 distinct binaries (gentle on the macOS code-sign launch
# path — see the AMFI launch-wedge note). The planner runs them via
# `nextest run -p gdeditor -p gdscene --lib --test <5 bins> -E <154 names>`,
# ticks each `- [ ]` box whose test passes, and seeds rework beads for failures.
#
# METHODOLOGY (2026-06-04): these lib unit tests are NECESSARY but NOT SUFFICIENT.
# A criterion is only truly satisfied by an APP-LEVEL test that boots the editor
# (EditorServerHandle::start / examples/editor.rs) and drives it over HTTP — a
# lib-model test (MainScreenSwitcher, SceneWorkspace, InspectorPanel, …) can pass
# while the feature is never wired into the running app (that is how the mode
# switch, New Scene, and selection->inspector all "passed" while broken). Add the
# server-booting e2e tests (editor_beads_test, editor_parity_test, …) to
# `test_binaries` and reference their fns from EDITOR_PARITY_EXIT.md so the gate
# actually exercises the assembled editor. See the `planner-methodology` beads.
[[phase]]
label = "editor-parity"
execution_map = "prd/EDITOR_PARITY_EXECUTION_MAP.md"
exit_criteria = "prd/EDITOR_PARITY_EXIT.md"
analysis = { source = "criteria" }
test_packages = ["gdeditor", "gdscene"]
lib = true
test_binaries = [
    "inspector_revert_test",
    "viewport_gizmo_move_test",
    "viewport_gizmo_scale_test",
    "viewport_smart_snap_test",
    "viewport_zoom_test",
]
completion = ["all_criteria_checked"]
